<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrical Calculations</title>
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1b2430;--p:#0b6bcb;--m:#667}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--c:#1a222d;--t:#e6ebf2;--p:#5aa7ff;--m:#9aa5b5}}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:0;background:var(--p);color:#fff;padding:10px;z-index:5}
header h1{margin:0 0 6px;font-size:17px}
#q{width:100%;box-sizing:border-box;padding:9px;border:0;border-radius:8px;font-size:15px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px}
#tabs button{white-space:nowrap;border:0;border-radius:16px;padding:7px 13px;background:var(--c);color:var(--t);font-size:14px}
#tabs button.on{background:var(--p);color:#fff}
.card{background:var(--c);margin:8px;padding:12px;border-radius:12px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 8px;font-size:15px}
.card small{color:var(--m);display:block;margin-bottom:6px;direction:ltr;text-align:left}
label{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:13px}
label span{flex:1}
input{width:48%;padding:7px;border:1px solid #8886;border-radius:6px;font-size:15px;direction:ltr;background:transparent;color:var(--t)}
.res{margin-top:8px;padding:8px;background:#0b6bcb18;border-radius:8px;font-size:14px;direction:ltr;text-align:left;min-height:18px}
.chip{border:1px solid var(--p);background:transparent;color:var(--t);border-radius:12px;padding:3px 9px;margin:2px;font-size:13px}.chip.on{background:var(--p);color:#fff}.res b{color:var(--p)}
</style></head><body>
<header><h1>⚡ Electrical Calculations — ماشین حساب مهندسی برق</h1>
<input id="q" placeholder="جستجوی فرمول..."></header>
<div id="tabs"></div><div id="list"></div>
<script>
const S=Math.sqrt,PI=Math.PI,L=s=>String(s).split(/[\s,،;]+/).filter(x=>x!=='').map(Number);
const sum=a=>a.reduce((x,y)=>x+y,0);
const D=(o,s,u)=>[o,s,u||''];
// f: [id,label] ; c(v) -> [[label,value,unit],...] ; v numeric, lists via L(raw) (raw in r)
const C=[
{k:'الکتروتکنیک',F:[
{n:'قانون اهم: ولتاژ',e:'V = I·R',f:[['I','جریان (A)'],['R','مقاومت (Ω)']],c:v=>[['V',v.I*v.R,'V']]},
{n:'قانون اهم: جریان',e:'I = V/R',f:[['V','ولتاژ (V)'],['R','مقاومت (Ω)']],c:v=>[['I',v.V/v.R,'A']]},
{n:'قانون اهم: مقاومت',e:'R = V/I',f:[['V','ولتاژ (V)'],['I','جریان (A)']],c:v=>[['R',v.V/v.I,'Ω']]},
{n:'توان DC از V و I',e:'P = V·I',f:[['V','ولتاژ (V)'],['I','جریان (A)']],c:v=>[['P',v.V*v.I,'W']]},
{n:'توان DC از I و R',e:'P = I²·R',f:[['I','جریان (A)'],['R','مقاومت (Ω)']],c:v=>[['P',v.I*v.I*v.R,'W']]},
{n:'توان DC از V و R',e:'P = V²/R',f:[['V','ولتاژ (V)'],['R','مقاومت (Ω)']],c:v=>[['P',v.V*v.V/v.R,'W']]},
{n:'مقاومت‌های سری',e:'Rt = R1+R2+…',f:[['r','مقادیر (Ω) با کاما']],list:1,c:v=>[['Rt',sum(L(v.r)),'Ω']]},
{n:'مقاومت‌های موازی',e:'1/Rt = Σ1/Ri',f:[['r','مقادیر (Ω) با کاما']],list:1,c:v=>[['Rt',1/sum(L(v.r).map(x=>1/x)),'Ω']]},
{n:'تقسیم ولتاژ',e:'Vo = Vin·R2/(R1+R2)',f:[['Vin','Vin (V)'],['R1','R1 (Ω)'],['R2','R2 (Ω)']],c:v=>[['Vo',v.Vin*v.R2/(v.R1+v.R2),'V']]},
{n:'تقسیم جریان',e:'I1 = It·R2/(R1+R2)',f:[['It','It (A)'],['R1','R1 (Ω)'],['R2','R2 (Ω)']],c:v=>[['I1',v.It*v.R2/(v.R1+v.R2),'A'],['I2',v.It*v.R1/(v.R1+v.R2),'A']]},
{n:'مقاومت سیم',e:'R = ρ·L/A',f:[['rho','ρ (Ω·mm²/m) مس=0.0175'],['L','طول (m)'],['A','سطح مقطع (mm²)']],c:v=>[['R',v.rho*v.L/v.A,'Ω']]},
{n:'ستاره به مثلث',e:'Rab = (RaRb+RbRc+RcRa)/Rc',f:[['a','Ra (Ω)'],['b','Rb (Ω)'],['c','Rc (Ω)']],c:v=>{const s=v.a*v.b+v.b*v.c+v.c*v.a;return[['Rab',s/v.c,'Ω'],['Rbc',s/v.a,'Ω'],['Rca',s/v.b,'Ω']]}},
{n:'مثلث به ستاره',e:'Ra = Rab·Rca/(Rab+Rbc+Rca)',f:[['ab','Rab (Ω)'],['bc','Rbc (Ω)'],['ca','Rca (Ω)']],c:v=>{const t=v.ab+v.bc+v.ca;return[['Ra',v.ab*v.ca/t,'Ω'],['Rb',v.ab*v.bc/t,'Ω'],['Rc',v.bc*v.ca/t,'Ω']]}},
{n:'خازن‌های سری',e:'1/Ct = Σ1/Ci',f:[['r','مقادیر (µF)']],list:1,c:v=>[['Ct',1/sum(L(v.r).map(x=>1/x)),'µF']]},
{n:'خازن‌های موازی',e:'Ct = ΣCi',f:[['r','مقادیر (µF)']],list:1,c:v=>[['Ct',sum(L(v.r)),'µF']]},
{n:'انرژی خازن',e:'E = ½CV²',f:[['C','C (µF)'],['V','V (V)']],c:v=>[['E',.5*v.C*1e-6*v.V*v.V,'J']]},
{n:'انرژی سلف',e:'E = ½LI²',f:[['L','L (mH)'],['I','I (A)']],c:v=>[['E',.5*v.L*1e-3*v.I*v.I,'J']]},
{n:'ثابت زمانی RC',e:'τ = R·C',f:[['R','R (Ω)'],['C','C (µF)']],c:v=>[['τ',v.R*v.C*1e-3,'ms'],['5τ',5*v.R*v.C*1e-3,'ms']]},
{n:'ثابت زمانی RL',e:'τ = L/R',f:[['L','L (mH)'],['R','R (Ω)']],c:v=>[['τ',v.L/v.R,'ms'],['5τ',5*v.L/v.R,'ms']]},
{n:'راکتانس سلف XL',e:'XL = 2πfL',f:[['f','f (Hz)'],['L','L (mH)']],c:v=>[['XL',2*PI*v.f*v.L*1e-3,'Ω']]},
{n:'راکتانس خازن XC',e:'XC = 1/(2πfC)',f:[['f','f (Hz)'],['C','C (µF)']],c:v=>[['XC',1/(2*PI*v.f*v.C*1e-6),'Ω']]},
{n:'فرکانس رزونانس',e:'f0 = 1/(2π√LC)',f:[['L','L (mH)'],['C','C (µF)']],c:v=>[['f0',1/(2*PI*S(v.L*1e-3*v.C*1e-6)),'Hz']]},
{n:'امپدانس RLC سری',e:'Z = √(R²+(XL−XC)²)',f:[['R','R (Ω)'],['L','L (mH)'],['C','C (µF)'],['f','f (Hz)']],c:v=>{const xl=2*PI*v.f*v.L*1e-3,xc=1/(2*PI*v.f*v.C*1e-6),x=xl-xc;return[['XL',xl,'Ω'],['XC',xc,'Ω'],['Z',S(v.R*v.R+x*x),'Ω'],['φ',Math.atan2(x,v.R)*180/PI,'°']]}},
{n:'ضریب کیفیت Q سری',e:'Q = (1/R)·√(L/C)',f:[['R','R (Ω)'],['L','L (mH)'],['C','C (µF)']],c:v=>{const q=S(v.L*1e-3/(v.C*1e-6))/v.R;const f0=1/(2*PI*S(v.L*1e-3*v.C*1e-6));return[['Q',q],['BW',f0/q,'Hz']]}},
]},
{k:'برق قدرت',F:[
{n:'توان تکفاز',e:'P=VIcosφ , Q=VIsinφ , S=VI',f:[['V','V (V)'],['I','I (A)'],['pf','cosφ']],c:v=>{const S1=v.V*v.I;return[['P',S1*v.pf,'W'],['Q',S1*S(1-v.pf*v.pf),'VAR'],['S',S1,'VA']]}},
{n:'توان سه‌فاز',e:'P = √3·VL·IL·cosφ',f:[['V','VL (V)'],['I','IL (A)'],['pf','cosφ']],c:v=>{const S1=S(3)*v.V*v.I;return[['P',S1*v.pf,'W'],['Q',S1*S(1-v.pf*v.pf),'VAR'],['S',S1,'VA']]}},
{n:'جریان تکفاز از kW',e:'I = P/(V·cosφ·η)',f:[['P','P (kW)'],['V','V (V)'],['pf','cosφ'],['eta','η (0-1)']],c:v=>[['I',v.P*1000/(v.V*v.pf*v.eta),'A']]},
{n:'جریان سه‌فاز از kW',e:'I = P/(√3·V·cosφ·η)',f:[['P','P (kW)'],['V','VL (V)'],['pf','cosφ'],['eta','η (0-1)']],c:v=>[['I',v.P*1000/(S(3)*v.V*v.pf*v.eta),'A']]},
{n:'اصلاح ضریب توان',e:'Qc = P(tanφ1 − tanφ2)',f:[['P','P (kW)'],['p1','cosφ قبل'],['p2','cosφ بعد'],['V','VL (V)'],['f','f (Hz)']],c:v=>{const t=x=>S(1-x*x)/x;const q=v.P*(t(v.p1)-t(v.p2));return[['Qc',q,'kVAR'],['C مثلث/فاز',q*1000/(3*2*PI*v.f*v.V*v.V)*1e6,'µF']]}},
{n:'افت ولتاژ تکفاز',e:'ΔV = 2·I·L·ρ·cosφ/A',f:[['I','I (A)'],['L','طول (m)'],['A','A (mm²)'],['rho','ρ (0.0175)'],['pf','cosφ'],['V','V (V)']],c:v=>{const d=2*v.I*v.L*v.rho*v.pf/v.A;return[['ΔV',d,'V'],['ΔV%',d/v.V*100,'%']]}},
{n:'افت ولتاژ سه‌فاز',e:'ΔV = √3·I·L·ρ·cosφ/A',f:[['I','I (A)'],['L','طول (m)'],['A','A (mm²)'],['rho','ρ (0.0175)'],['pf','cosφ'],['V','VL (V)']],c:v=>{const d=S(3)*v.I*v.L*v.rho*v.pf/v.A;return[['ΔV',d,'V'],['ΔV%',d/v.V*100,'%']]}},
{n:'سطح مقطع کابل (سه‌فاز)',e:'A = √3·I·L·ρ·cosφ/ΔV',f:[['I','I (A)'],['L','طول (m)'],['rho','ρ (0.0175)'],['pf','cosφ'],['V','VL (V)'],['pc','افت مجاز (%)']],c:v=>[['A',S(3)*v.I*v.L*v.rho*v.pf/(v.V*v.pc/100),'mm²']]},
{n:'تلفات توان خط',e:'Ploss = 3·I²·R',f:[['I','I (A)'],['R','R هر فاز (Ω)']],c:v=>[['Ploss',3*v.I*v.I*v.R,'W']]},
{n:'ترانسفورماتور: نسبت دور',e:'V1/V2 = N1/N2 = I2/I1',f:[['V1','V1'],['V2','V2'],['N1','N1 (دور)'],['I1','I1 (A)']],c:v=>[['N2',v.N1*v.V2/v.V1],['a',v.V1/v.V2],['I2',v.I1*v.V1/v.V2,'A']]},
{n:'بازده ترانسفورماتور',e:'η = Pout/(Pout+Pcu+Pfe)',f:[['Po','Pout (W)'],['Pcu','Pcu (W)'],['Pfe','Pfe (W)']],c:v=>[['η',v.Po/(v.Po+v.Pcu+v.Pfe)*100,'%']]},
{n:'جریان اتصال کوتاه ترانس',e:'Isc = In·100/uk%',f:[['S','S (kVA)'],['V','V ثانویه (V)'],['uk','uk (%)']],c:v=>{const i=v.S*1000/(S(3)*v.V);return[['In',i,'A'],['Isc',i*100/v.uk,'A']]}},
{n:'سرعت سنکرون و لغزش',e:'ns=120f/p , s=(ns−nr)/ns',f:[['f','f (Hz)'],['p','تعداد قطب'],['nr','سرعت روتور (rpm)']],c:v=>{const n=120*v.f/v.p;return[['ns',n,'rpm'],['s',(n-v.nr)/n*100,'%']]}},
{n:'گشتاور موتور',e:'T = 9550·P/n',f:[['P','P (kW)'],['n','n (rpm)']],c:v=>[['T',9550*v.P/v.n,'N·m']]},
{n:'انرژی و هزینه',e:'E = P·h·days',f:[['P','P (kW)'],['h','ساعت/روز'],['d','تعداد روز'],['pr','قیمت هر kWh']],c:v=>{const e=v.P*v.h*v.d;return[['E',e,'kWh'],['هزینه',e*v.pr]]}},
]},
{k:'الکترونیک',F:[
{n:'مقاومت LED',e:'R = (Vs−Vf)/If',f:[['Vs','Vs (V)'],['Vf','Vf (V)'],['If','If (mA)']],c:v=>{const r=(v.Vs-v.Vf)/(v.If/1e3);return[['R',r,'Ω'],['P',(v.If/1e3)**2*r,'W']]}},
{n:'مقاومت دیود زنر',e:'R = (Vin−Vz)/(Iz+IL)',f:[['Vin','Vin (V)'],['Vz','Vz (V)'],['Iz','Iz (mA)'],['IL','IL (mA)']],c:v=>{const i=(v.Iz+v.IL)/1e3,r=(v.Vin-v.Vz)/i;return[['R',r,'Ω'],['PR',i*i*r,'W'],['PZ',v.Vz*v.Iz/1e3,'W']]}},
{n:'اپ‌امپ معکوس‌کننده',e:'Av = −Rf/Rin',f:[['Rf','Rf (Ω)'],['Rin','Rin (Ω)'],['Vin','Vin (V)']],c:v=>[['Av',-v.Rf/v.Rin],['Vout',-v.Rf/v.Rin*v.Vin,'V']]},
{n:'اپ‌امپ غیرمعکوس',e:'Av = 1 + Rf/Rg',f:[['Rf','Rf (Ω)'],['Rg','Rg (Ω)'],['Vin','Vin (V)']],c:v=>[['Av',1+v.Rf/v.Rg],['Vout',(1+v.Rf/v.Rg)*v.Vin,'V']]},
{n:'فیلتر RC (فرکانس قطع)',e:'fc = 1/(2πRC)',f:[['R','R (Ω)'],['C','C (nF)']],c:v=>[['fc',1/(2*PI*v.R*v.C*1e-9),'Hz']]},
{n:'تایمر 555 آستابل',e:'f = 1.44/((R1+2R2)C)',f:[['R1','R1 (Ω)'],['R2','R2 (Ω)'],['C','C (µF)']],c:v=>{const f=1.44/((v.R1+2*v.R2)*v.C*1e-6);return[['f',f,'Hz'],['T',1e3/f,'ms'],['Duty',(v.R1+v.R2)/(v.R1+2*v.R2)*100,'%']]}},
{n:'دسی‌بل',e:'dB = 10log(P2/P1) , 20log(V2/V1)',f:[['a','P1 یا V1'],['b','P2 یا V2']],c:v=>[['dB توان',10*Math.log10(v.b/v.a),'dB'],['dB ولتاژ',20*Math.log10(v.b/v.a),'dB']]},
{n:'ترانزیستور BJT',e:'Ic = β·Ib , Ie = Ic+Ib',f:[['b','β'],['Ib','Ib (µA)']],c:v=>[['Ic',v.b*v.Ib/1e3,'mA'],['Ie',(v.b+1)*v.Ib/1e3,'mA']]},
{n:'یکسوساز: ولتاژها',e:'Vp=√2·Vrms , Vavg=2Vp/π',f:[['Vr','Vrms (V)']],c:v=>{const p=S(2)*v.Vr;return[['Vp',p,'V'],['Vdc تمام‌موج',2*p/PI,'V'],['Vdc نیم‌موج',p/PI,'V']]}},
{n:'ریپل خازن فیلتر',e:'Vr = I/(2fC)',f:[['I','I (mA)'],['f','f شبکه (Hz)'],['C','C (µF)']],c:v=>[['Vripple',v.I/1e3/(2*v.f*v.C*1e-6),'V']]},
{n:'رزولوشن ADC/DAC',e:'LSB = Vref/2ⁿ',f:[['V','Vref (V)'],['n','تعداد بیت']],c:v=>[['LSB',v.V/2**v.n*1e3,'mV'],['Steps',2**v.n]]},
]},
{k:'ابزار دقیق',F:[
{n:'4-20mA به مقدار',e:'X = min+(I−4)/16·(max−min)',f:[['I','I (mA)'],['mn','Min'],['mx','Max']],c:v=>[['X',v.mn+(v.I-4)/16*(v.mx-v.mn)],['%',(v.I-4)/16*100,'%']]},
{n:'مقدار به 4-20mA',e:'I = 4+16·(X−min)/(max−min)',f:[['X','X'],['mn','Min'],['mx','Max']],c:v=>[['I',4+16*(v.X-v.mn)/(v.mx-v.mn),'mA'],['V روی 250Ω',(4+16*(v.X-v.mn)/(v.mx-v.mn))*.25,'V']]},
{n:'تبدیل خطی مقیاس',e:'y = y0+(x−x0)(y1−y0)/(x1−x0)',f:[['x','x'],['x0','x min'],['x1','x max'],['y0','y min'],['y1','y max']],c:v=>[['y',v.y0+(v.x-v.x0)*(v.y1-v.y0)/(v.x1-v.x0)]]},
{n:'شنت آمپرمتر',e:'Rsh = Im·Rm/(I−Im)',f:[['Im','Im (mA)'],['Rm','Rm (Ω)'],['I','I کل (A)']],c:v=>{const im=v.Im/1e3;return[['Rsh',im*v.Rm/(v.I-im),'Ω']]}},
{n:'مقاومت مولتی‌پلایر ولت‌متر',e:'Rs = V/Im − Rm',f:[['V','V کامل (V)'],['Im','Im (mA)'],['Rm','Rm (Ω)']],c:v=>[['Rs',v.V/(v.Im/1e3)-v.Rm,'Ω']]},
{n:'PT100: مقاومت به دما',e:'R = R0(1+AT+BT²)',f:[['R','R (Ω)'],['R0','R0 (100)']],c:v=>{const A=3.9083e-3,B=-5.775e-7;return[['T',(-A+S(A*A-4*B*(1-v.R/v.R0)))/(2*B),'°C']]}},
{n:'PT100: دما به مقاومت',e:'R = R0(1+AT+BT²)',f:[['T','T (°C)'],['R0','R0 (100)']],c:v=>[['R',v.R0*(1+3.9083e-3*v.T-5.775e-7*v.T*v.T),'Ω']]},
{n:'پل وتستون',e:'Rx = R2·R3/R1',f:[['R1','R1'],['R2','R2'],['R3','R3']],c:v=>[['Rx',v.R2*v.R3/v.R1,'Ω']]},
{n:'استرین گیج',e:'ΔR/R = GF·ε , Vo = Vex·GF·ε/4',f:[['GF','GF'],['e','ε (µε)'],['R0','R0 (Ω)'],['Vex','Vex (V)']],c:v=>{const x=v.GF*v.e*1e-6;return[['ΔR',x*v.R0,'Ω'],['Vo ¼پل',v.Vex*x/4*1e3,'mV']]}},
{n:'فلو با DP',e:'Q = Qmax·√(ΔP/ΔPmax)',f:[['Qm','Qmax'],['dp','ΔP'],['dpm','ΔP max']],c:v=>[['Q',v.Qm*S(v.dp/v.dpm)]]}, 
{n:'سطح مایع (هیدرواستاتیک)',e:'h = ΔP/(ρ·g)',f:[['dp','ΔP (kPa)'],['rho','ρ (kg/m³) آب=1000']],c:v=>[['h',v.dp*1000/(v.rho*9.80665),'m']]},
{n:'درصد خطا',e:'%err = (meas−true)/true·100',f:[['m','مقدار اندازه‌گیری'],['t','مقدار واقعی']],c:v=>[['خطا',(v.m-v.t)/v.t*100,'%']]},
]}];
/*EQ*/
const MK=['sqrt','sin','cos','tan','acos','asin','atan','log','log10','exp','PI','abs','pow'];
const LB={V:'ولتاژ V',I:'جریان A',R:'مقاومت Ω',P:'توان W',t:'زمان s',q:'بار C',W:'انرژی J',C:'خازن F',L:'سلف H',f:'فرکانس Hz',l:'طول m',A:'سطح m² (یا mm² در افت)',rho:'مقاومت ویژه',Z:'امپدانس Ω',pf:'cosφ',S:'توان ظاهری VA',Q:'توان راکتیو VAR',eta:'بازده 0-1',N:'تعداد دور',B:'چگالی شار T',r:'شعاع/فاصله m',d:'فاصله/قطر m'};

function solve(fn,vs,v,u){const G=x=>fn(...vs.map(k=>k==u?x:v[k]));const xs=[];for(let x=1e-12;x<1e13;x*=1.3)xs.push(x);
const all=[...xs.map(x=>-x).reverse(),0,...xs],out=[];
const add=r=>{if(!out.some(o=>Math.abs(o-r)<=1e-6*Math.abs(r)+1e-15))out.push(r)};
for(let i=0;i<all.length-1;i++){let a=all[i],b=all[i+1],ga=G(a),gb=G(b);if(!isFinite(ga)||!isFinite(gb))continue;
if(ga===0){add(a);continue}if(ga*gb>0)continue;const m0=Math.max(Math.abs(ga),Math.abs(gb));
for(let k=0;k<200;k++){const m=(a+b)/2,gm=G(m);if(ga*gm<=0){b=m;gb=gm}else{a=m;ga=gm}}
const r=(a+b)/2;if(Math.abs(G(r))<1e-6*m0)add(r)}
return out.slice(0,4)}
function eqCards(g,s){g.E.forEach(([n,ex])=>{if(s&&!(n+ex).toLowerCase().includes(s))return;

const r=d.querySelector('.res'),ins=d.querySelectorAll('input');
const run=()=>{const v={};let ok=true;ins.forEach(i=>{const t=i.value.trim();if(t==='')ok=false;v[i.dataset.id]=F.list?t:parseFloat(t);if(!F.list&&isNaN(v[i.dataset.id]))ok=false});
r.innerHTML=ok?F.c(v).map(o=>o[0]+' = <b>'+fmt(o[1])+'</b> '+(o[2]||'')).join('<br>'):'';};
ins.forEach(i=>i.oninput=run);list.appendChild(d)});if(g.E)eqCards(g,s)})}
